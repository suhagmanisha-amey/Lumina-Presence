# Scheduled draft generation.
#
# This workflow only ever *drafts*. It opens a PR containing the new drafts;
# merging the PR is the approval step. Nothing reaches Instagram from CI.
name: Discover content

on:
  schedule:
    # 07:00 UTC Mon/Wed/Fri = 12:30 IST. Cron is always UTC.
    - cron: "0 7 * * 1,3,5"
  workflow_dispatch:
    inputs:
      count:
        description: "How many drafts to generate"
        required: false
        default: "3"

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Generate drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: lumina discover --count "${{ inputs.count || '3' }}"

      # content/queue/*.json is gitignored on purpose — locally, drafts stay
      # out of `git status` noise. But that means the file this step just
      # wrote is invisible to create-pull-request's own change detection
      # below (a plain `git status`/`git diff` never sees ignored paths, even
      # brand new ones), so it silently finds nothing to commit and skips
      # opening a PR — the draft would exist for the length of this job and
      # then vanish with the runner. Force-add bypasses .gitignore for these
      # two paths only, in this CI checkout only; the local ignore rule and
      # `lumina discover` behavior are untouched.
      - name: Stage the generated draft (bypasses .gitignore for CI delivery)
        run: git add -f content/queue content/last-research.md

      - name: Open a review PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: drafts/${{ github.run_id }}
          title: "Drafts for review — ${{ github.run_id }}"
          commit-message: "Add generated drafts"
          body: |
            Generated by the scheduled discovery run.

            Review `content/queue/*.json`, then locally:

            ```
            lumina review
            lumina approve <id>
            lumina publish --all
            ```

            Merging this PR does not publish anything.
          add-paths: |
            content/queue
            content/last-research.md
