[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina-presence"
version = "0.1.0"
description = "A draft-and-approve Instagram content agent"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69.0",
    "click>=8.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "requests>=2.32.0",
]

[project.scripts]
lumina = "lumina.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
